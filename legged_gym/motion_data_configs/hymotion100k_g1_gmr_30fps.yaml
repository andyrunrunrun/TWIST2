# HYMotion100k (HY-Motion -> GMR Unitree G1) motions with per-frame HY single-stream features.
#
# Required env var:
#   HY_HUMANOID_ROOT=/path/to/HY-Humanoid (this repo)
#
# Motion files are discovered automatically under root_path by glob.
root_path: ${HY_HUMANOID_ROOT}/GMR/data/HYMotion100k_g1_GMR_30fps

# HY-Motion exported features (single_stream_feat.npz) under the HY-Humanoid outputs root.
hy_feat_root: ${HY_HUMANOID_ROOT}/outputs/HY-Motion-100k
hy_feat_t: 1.0
hy_feat_dim: 1280

auto_discover: true
auto_discover_glob: "**/motion.pkl"
auto_discover_weight: 1.0
